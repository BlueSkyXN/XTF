name: Multi-Platform Build

on:
  push:
    branches: [ main, master, dev, codex/xtf-cli-v2 ]
  workflow_dispatch:
    inputs:
      build_1_9_rollback:
        description: Build the exact XTF 1.9 rollback package instead of XTF 2.0 artifacts
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  source-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_1_9_rollback }}
    uses: ./.github/workflows/test.yml

  build-xtf:
    needs: [source-tests]
    name: Build XTF
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_1_9_rollback }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            platform: linux-x64
            setup_python_arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux-arm64
            setup_python_arch: arm64
          - os: windows-2022
            arch: x64
            platform: windows-x64
            setup_python_arch: x64
          - os: macos-15
            arch: arm64
            platform: macos-arm64
            setup_python_arch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.setup_python_arch }}
    
    - name: Install dependencies for XTF
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<82" "pyinstaller==6.19.0"
        # Pin pandas/numpy for PyInstaller --onefile compatibility on Linux.
        # numpy>=2.0 wheels ship libscipy_openblas64_*.so, which fails the ELF
        # page-alignment check under the PyInstaller onefile bootloader on
        # linux-x64 (reproduced) and is expected to fail on linux-arm64. The
        # packaging interpreter is fixed to Python 3.11 here, so numpy<2 stays
        # installable. Unit tests in test.yml keep the unpinned requirements.txt
        # so the Python 3.13 matrix leg can resolve numpy>=2.1.
        #
        # pandas>=2.2 is the minimum that ships engine="calamine"; earlier 2.x
        # releases raise "Unknown engine: calamine" and utils.excel_reader falls
        # back to OpenPyXL, losing the 4-20x read speedup. pandas<3 keeps pip
        # off pandas 3.x, which requires numpy>=2 and would reintroduce the
        # openblas failure above.
        python -m pip install -c constraints-build.txt -r requirements.txt -r requirements-dev.txt
        python -m pip check
        python -m pip freeze > build-dependencies.txt
      shell: bash

    - name: Test with the packaging dependency set
      run: python -m pytest tests/ -q -m "not integration"

    - name: Build XTF
      run: |
        pyinstaller --onefile \
          --collect-all=charset_normalizer \
          --collect-all=python_calamine \
          --collect-all=tzdata \
          --hidden-import=core.config \
          --hidden-import=core.bootstrap \
          --hidden-import=core.compiler \
          --hidden-import=core.key_policy \
          --hidden-import=core.mode_policy \
          --hidden-import=core.plan \
          --hidden-import=core.reconcile \
          --hidden-import=core.runtime_config \
          --hidden-import=core.service \
          --hidden-import=core.snapshot \
          --hidden-import=core.converter \
          --hidden-import=core.control \
          --hidden-import=core.reader \
          --hidden-import=api.auth \
          --hidden-import=api.base \
          --hidden-import=api.bitable_backend \
          --hidden-import=api.bitable_v1 \
          --hidden-import=api.bitable_v3 \
          --hidden-import=api.sheet \
          --hidden-import=utils.excel_reader \
          --hidden-import=xtf_cli.runtime \
          --hidden-import=xtf_cli.parser \
          --hidden-import=xtf_cli.config \
          --hidden-import=xtf_cli.errors \
          XTF.py \
          --distpath dist/${{ matrix.platform }}
      shell: bash

    - name: Smoke the packaged CLI with real XLSX files offline
      shell: bash
      run: |
        executable="dist/${{ matrix.platform }}/XTF"
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          executable="${executable}.exe"
        fi
        python -m tools.smoke_binary --executable "$executable" --expected-version "$VERSION"

    - name: Prepare XTF artifacts
      run: |
        platform="${{ matrix.platform }}"
        version="${{ env.VERSION }}"
        
        package_dir="artifacts/XTF_py-${platform}-${version}"
        mkdir -p "$package_dir"
        
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          binary_name="XTF.exe"
        else
          binary_name="XTF"
        fi
        cp "dist/${platform}/${binary_name}" "$package_dir/"
        if [[ "$binary_name" == "XTF" ]]; then
          chmod +x "$package_dir/XTF"
        fi

        cp config.example.yaml README.md QUICKSTART.md "$package_dir/"
        export PACKAGE_DIR="$package_dir"
        export BINARY_NAME="$binary_name"
        export TARGET_PLATFORM="$platform"
        python - <<'PY'
        import hashlib
        import json
        import os
        import platform
        from pathlib import Path

        package = Path(os.environ["PACKAGE_DIR"])
        names = [
            os.environ["BINARY_NAME"],
            "config.example.yaml",
            "README.md",
            "QUICKSTART.md",
        ]
        (package / "BUILD_INFO.json").write_text(json.dumps({
            "source_sha": os.environ.get("GITHUB_SHA"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "version": os.environ["VERSION"],
            "target_platform": os.environ["TARGET_PLATFORM"],
            "binary_sha256": hashlib.sha256((package / os.environ["BINARY_NAME"]).read_bytes()).hexdigest(),
            "python": platform.python_version(),
            "platform": platform.platform(),
            "dependencies": Path("build-dependencies.txt").read_text(),
        }, indent=2), encoding="utf-8")
        names.append("BUILD_INFO.json")
        lines = []
        for name in names:
            digest = hashlib.sha256((package / name).read_bytes()).hexdigest()
            lines.append(f"{digest}  {name}")
        (package / "checksums.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
        
        # Install zip on Windows if needed
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          choco install zip -y
        fi
        
        cd artifacts
        zip -r "../XTF_py-${platform}-${version}.zip" "XTF_py-${platform}-${version}"/
        cd ..
      shell: bash
    
    - name: Upload XTF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XTF_py-${{ matrix.platform }}-${{ env.VERSION }}
        path: XTF_py-${{ matrix.platform }}-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  create-platform-bundles:
    runs-on: ubuntu-latest
    needs: [build-xtf]
    strategy:
      matrix:
        platform: [linux-x64, linux-arm64, windows-x64, macos-arm64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Download all artifacts for platform
      uses: actions/download-artifact@v4
      with:
        pattern: "*_py-${{ matrix.platform }}-${{ env.VERSION }}"
        merge-multiple: true
    
    - name: Create platform bundle
      run: |
        platform="${{ matrix.platform }}"
        version="${{ env.VERSION }}"
        
        # Install 7z for better cross-platform compatibility
        sudo apt-get update && sudo apt-get install -y p7zip-full
        
        # Extract the single XTF program ZIP with error handling. XTF-Sheet and
        # XTF-Bitable legacy artifacts are no longer produced; the 1.9 rollback
        # workflow remains the only source of those binaries.
        echo "Extracting XTF_py-${platform}-${version}.zip..."
        if ! 7z x "XTF_py-${platform}-${version}.zip" -y; then
          echo "7z failed, trying unzip with compatibility mode..."
          unzip -DD "XTF_py-${platform}-${version}.zip" || (echo "Failed to extract XTF zip" && exit 1)
        fi
        
        # Create platform bundle directory
        mkdir -p "ALL-XTF-${platform}-${version}"
        
        # Copy the XTF program into the bundle
        cp -r "XTF_py-${platform}-${version}"/* "ALL-XTF-${platform}-${version}/"
        
        # Create platform bundle ZIP
        zip -r "ALL-XTF-${platform}-${version}.zip" "ALL-XTF-${platform}-${version}"/
      shell: bash
    
    - name: Upload platform bundle
      uses: actions/upload-artifact@v4
      with:
        name: ALL-XTF-${{ matrix.platform }}-${{ env.VERSION }}
        path: ALL-XTF-${{ matrix.platform }}-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  create-release-bundle:
    runs-on: ubuntu-latest
    needs: create-platform-bundles
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Download all platform bundles
      uses: actions/download-artifact@v4
      with:
        pattern: ALL-XTF-*-${{ env.VERSION }}
        merge-multiple: true
    
    - name: Create full release bundle
      run: |
        version="${{ env.VERSION }}"
        
        # Install 7z for better cross-platform compatibility
        sudo apt-get update && sudo apt-get install -y p7zip-full
        
        # Create full release directory
        mkdir -p "FULL-XTF-${version}"
        
        for platform in linux-x64 linux-arm64 windows-x64 macos-arm64; do
          test -f "ALL-XTF-${platform}-${version}.zip" || exit 1
        done
        # Extract and organize all platform bundles with error handling
        for zip_file in ALL-XTF-*-"${version}".zip; do
          if [[ -f "$zip_file" ]]; then
            echo "Extracting $zip_file..."
            if ! 7z x "$zip_file" -y; then
              echo "7z failed, trying unzip with compatibility mode..."
              unzip -DD "$zip_file" || (echo "Failed to extract $zip_file" && exit 1)
            fi
            platform_dir=$(basename "$zip_file" .zip)
            mv "$platform_dir" "FULL-XTF-${version}/"
          fi
        done
        
        # Create full release ZIP
        zip -r "FULL-XTF-${version}.zip" "FULL-XTF-${version}"/
      shell: bash
    
    - name: Upload full release bundle
      uses: actions/upload-artifact@v4
      with:
        name: FULL-XTF-${{ env.VERSION }}
        path: FULL-XTF-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  build-1-9-rollback:
    name: Build XTF 1.9 Rollback Package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_1_9_rollback }}
    uses: ./.github/workflows/build-1.9-rollback.yml
    permissions:
      contents: read

name: Multi-Platform Build

on:
  push:
    branches: [ main, dev, codex/xtf-cli-v2 ]
  pull_request:
    branches: [ main, dev, codex/xtf-cli-v2 ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      build_1_9_rollback:
        description: Build the exact XTF 1.9 rollback package instead of XTF 2.0 artifacts
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-xtf:
    name: Build XTF
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_1_9_rollback }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            platform: linux-x64
            setup_python_arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux-arm64
            setup_python_arch: arm64
          - os: windows-2022
            arch: x64
            platform: windows-x64
            setup_python_arch: x64
          - os: macos-15
            arch: arm64
            platform: macos-arm64
            setup_python_arch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.setup_python_arch }}
    
    - name: Install dependencies for XTF
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<82" "pyinstaller==6.19.0"
        python -m pip install -r requirements.txt
      shell: bash
    
    - name: Build XTF
      run: |
        pyinstaller --onefile \
          --collect-all=charset_normalizer \
          --hidden-import=core.config \
          --hidden-import=core.bootstrap \
          --hidden-import=core.compiler \
          --hidden-import=core.key_policy \
          --hidden-import=core.mode_policy \
          --hidden-import=core.plan \
          --hidden-import=core.reconcile \
          --hidden-import=core.runtime_config \
          --hidden-import=core.service \
          --hidden-import=core.snapshot \
          --hidden-import=core.converter \
          --hidden-import=core.control \
          --hidden-import=core.reader \
          --hidden-import=api.auth \
          --hidden-import=api.base \
          --hidden-import=api.bitable_backend \
          --hidden-import=api.bitable_v1 \
          --hidden-import=api.bitable_v3 \
          --hidden-import=api.sheet \
          --hidden-import=utils.excel_reader \
          --hidden-import=xtf_cli.runtime \
          --hidden-import=xtf_cli.parser \
          --hidden-import=xtf_cli.config \
          --hidden-import=xtf_cli.errors \
          XTF.py \
          --distpath dist/${{ matrix.platform }}
      shell: bash

    - name: Smoke XTF CLI
      run: |
        platform="${{ matrix.platform }}"
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          executable="dist/${platform}/XTF.exe"
        else
          executable="dist/${platform}/XTF"
        fi
        "$executable" --version
        "$executable" sync --help
        smoke_dir=$(mktemp -d)
        "$executable" config init --target-type bitable --output "$smoke_dir/config.yaml"
        test -f "$smoke_dir/config.yaml"
      shell: bash
    
    - name: Prepare XTF artifacts
      run: |
        platform="${{ matrix.platform }}"
        version="${{ env.VERSION }}"
        
        package_dir="artifacts/XTF_py-${platform}-${version}"
        mkdir -p "$package_dir"
        
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          binary_name="XTF.exe"
        else
          binary_name="XTF"
        fi
        cp "dist/${platform}/${binary_name}" "$package_dir/"
        if [[ "$binary_name" == "XTF" ]]; then
          chmod +x "$package_dir/XTF"
        fi

        cp config.example.yaml README.md QUICKSTART.md "$package_dir/"
        export PACKAGE_DIR="$package_dir"
        export BINARY_NAME="$binary_name"
        python - <<'PY'
        import hashlib
        import os
        from pathlib import Path

        package = Path(os.environ["PACKAGE_DIR"])
        names = [
            os.environ["BINARY_NAME"],
            "config.example.yaml",
            "README.md",
            "QUICKSTART.md",
        ]
        lines = []
        for name in names:
            digest = hashlib.sha256((package / name).read_bytes()).hexdigest()
            lines.append(f"{digest}  {name}")
        (package / "checksums.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
        
        # Install zip on Windows if needed
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          choco install zip -y
        fi
        
        cd artifacts
        zip -r "../XTF_py-${platform}-${version}.zip" "XTF_py-${platform}-${version}"/
        cd ..
      shell: bash
    
    - name: Upload XTF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XTF_py-${{ matrix.platform }}-${{ env.VERSION }}
        path: XTF_py-${{ matrix.platform }}-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  build-xtf-sheet:
    name: Build XTF-Sheet (Legacy)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_1_9_rollback }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            platform: linux-x64
            setup_python_arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux-arm64
            setup_python_arch: arm64
          - os: windows-2022
            arch: x64
            platform: windows-x64
            setup_python_arch: x64
          - os: macos-15
            arch: arm64
            platform: macos-arm64
            setup_python_arch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.setup_python_arch }}
    
    - name: Install dependencies for XTF-Sheet (minimal)
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<82" "pyinstaller==6.19.0"
        python -m pip install pandas requests pyyaml
      shell: bash
    
    - name: Build XTF-Sheet
      run: |
        pyinstaller --onefile \
          --collect-all=charset_normalizer \
          lite/XTF_Sheet.py \
          --name XTF-Sheet \
          --distpath dist/${{ matrix.platform }}
      shell: bash

    - name: Prepare XTF-Sheet artifacts
      run: |
        platform="${{ matrix.platform }}"
        version="${{ env.VERSION }}"
        
        mkdir -p "artifacts/XTF-Sheet_py-${platform}-${version}"
        
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          cp "dist/${platform}/XTF-Sheet.exe" "artifacts/XTF-Sheet_py-${platform}-${version}/"
        else
          cp "dist/${platform}/XTF-Sheet" "artifacts/XTF-Sheet_py-${platform}-${version}/"
          chmod +x "artifacts/XTF-Sheet_py-${platform}-${version}/XTF-Sheet"
        fi
        
        cp lite/config.sheet.example.yaml "artifacts/XTF-Sheet_py-${platform}-${version}/config.yaml"
        
        # Install zip on Windows if needed
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          choco install zip -y
        fi
        
        cd artifacts
        zip -r "../XTF-Sheet_py-${platform}-${version}.zip" "XTF-Sheet_py-${platform}-${version}"/
        cd ..
      shell: bash
    
    - name: Upload XTF-Sheet artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XTF-Sheet_py-${{ matrix.platform }}-${{ env.VERSION }}
        path: XTF-Sheet_py-${{ matrix.platform }}-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  build-xtf-bitable:
    name: Build XTF-Bitable (Legacy)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_1_9_rollback }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            platform: linux-x64
            setup_python_arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux-arm64
            setup_python_arch: arm64
          - os: windows-2022
            arch: x64
            platform: windows-x64
            setup_python_arch: x64
          - os: macos-15
            arch: arm64
            platform: macos-arm64
            setup_python_arch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.setup_python_arch }}
    
    - name: Install dependencies for XTF-Bitable (minimal)
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<82" "pyinstaller==6.19.0"
        python -m pip install pandas requests pyyaml
      shell: bash
    
    - name: Build XTF-Bitable
      run: |
        pyinstaller --onefile \
          --collect-all=charset_normalizer \
          lite/XTF_Bitable.py \
          --name XTF-Bitable \
          --distpath dist/${{ matrix.platform }}
      shell: bash

    - name: Prepare XTF-Bitable artifacts
      run: |
        platform="${{ matrix.platform }}"
        version="${{ env.VERSION }}"
        
        mkdir -p "artifacts/XTF-Bitable_py-${platform}-${version}"
        
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          cp "dist/${platform}/XTF-Bitable.exe" "artifacts/XTF-Bitable_py-${platform}-${version}/"
        else
          cp "dist/${platform}/XTF-Bitable" "artifacts/XTF-Bitable_py-${platform}-${version}/"
          chmod +x "artifacts/XTF-Bitable_py-${platform}-${version}/XTF-Bitable"
        fi
        
        cp lite/config.bitable.example.yaml "artifacts/XTF-Bitable_py-${platform}-${version}/config.yaml"
        
        # Install zip on Windows if needed
        if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
          choco install zip -y
        fi
        
        cd artifacts
        zip -r "../XTF-Bitable_py-${platform}-${version}.zip" "XTF-Bitable_py-${platform}-${version}"/
        cd ..
      shell: bash
    
    - name: Upload XTF-Bitable artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XTF-Bitable_py-${{ matrix.platform }}-${{ env.VERSION }}
        path: XTF-Bitable_py-${{ matrix.platform }}-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30
    
  create-platform-bundles:
    runs-on: ubuntu-latest
    needs: [build-xtf, build-xtf-sheet, build-xtf-bitable]
    strategy:
      matrix:
        platform: [linux-x64, linux-arm64, windows-x64, macos-arm64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Download all artifacts for platform
      uses: actions/download-artifact@v4
      with:
        pattern: "*_py-${{ matrix.platform }}-${{ env.VERSION }}"
        merge-multiple: true
    
    - name: Create platform bundle
      run: |
        platform="${{ matrix.platform }}"
        version="${{ env.VERSION }}"
        
        # Install 7z for better cross-platform compatibility
        sudo apt-get update && sudo apt-get install -y p7zip-full
        
        # Extract individual program ZIPs with error handling
        echo "Extracting XTF_py-${platform}-${version}.zip..."
        if ! 7z x "XTF_py-${platform}-${version}.zip" -y; then
          echo "7z failed, trying unzip with compatibility mode..."
          unzip -DD "XTF_py-${platform}-${version}.zip" || (echo "Failed to extract XTF zip" && exit 1)
        fi
        
        echo "Extracting XTF-Sheet_py-${platform}-${version}.zip..."
        if ! 7z x "XTF-Sheet_py-${platform}-${version}.zip" -y; then
          echo "7z failed, trying unzip with compatibility mode..."
          unzip -DD "XTF-Sheet_py-${platform}-${version}.zip" || (echo "Failed to extract XTF-Sheet zip" && exit 1)
        fi
        
        echo "Extracting XTF-Bitable_py-${platform}-${version}.zip..."
        if ! 7z x "XTF-Bitable_py-${platform}-${version}.zip" -y; then
          echo "7z failed, trying unzip with compatibility mode..."
          unzip -DD "XTF-Bitable_py-${platform}-${version}.zip" || (echo "Failed to extract XTF-Bitable zip" && exit 1)
        fi
        
        # Create platform bundle directory
        mkdir -p "ALL-XTF-${platform}-${version}"
        
        # Copy all programs to bundle
        cp -r "XTF_py-${platform}-${version}"/* "ALL-XTF-${platform}-${version}/"
        cp -r "XTF-Sheet_py-${platform}-${version}"/* "ALL-XTF-${platform}-${version}/"
        cp -r "XTF-Bitable_py-${platform}-${version}"/* "ALL-XTF-${platform}-${version}/"
        
        # Create platform bundle ZIP
        zip -r "ALL-XTF-${platform}-${version}.zip" "ALL-XTF-${platform}-${version}"/
      shell: bash
    
    - name: Upload platform bundle
      uses: actions/upload-artifact@v4
      with:
        name: ALL-XTF-${{ matrix.platform }}-${{ env.VERSION }}
        path: ALL-XTF-${{ matrix.platform }}-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  create-release-bundle:
    runs-on: ubuntu-latest
    needs: create-platform-bundles
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Download all platform bundles
      uses: actions/download-artifact@v4
      with:
        pattern: ALL-XTF-*-${{ env.VERSION }}
        merge-multiple: true
    
    - name: Create full release bundle
      run: |
        version="${{ env.VERSION }}"
        
        # Install 7z for better cross-platform compatibility
        sudo apt-get update && sudo apt-get install -y p7zip-full
        
        # Create full release directory
        mkdir -p "FULL-XTF-${version}"
        
        # Extract and organize all platform bundles with error handling
        for zip_file in ALL-XTF-*-"${version}".zip; do
          if [[ -f "$zip_file" ]]; then
            echo "Extracting $zip_file..."
            if ! 7z x "$zip_file" -y; then
              echo "7z failed, trying unzip with compatibility mode..."
              unzip -DD "$zip_file" || (echo "Failed to extract $zip_file" && exit 1)
            fi
            platform_dir=$(basename "$zip_file" .zip)
            mv "$platform_dir" "FULL-XTF-${version}/"
          fi
        done
        
        # Create full release ZIP
        zip -r "FULL-XTF-${version}.zip" "FULL-XTF-${version}"/
      shell: bash
    
    - name: Upload full release bundle
      uses: actions/upload-artifact@v4
      with:
        name: FULL-XTF-${{ env.VERSION }}
        path: FULL-XTF-${{ env.VERSION }}.zip
        compression-level: 0
        retention-days: 30

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-platform-bundles, create-release-bundle]
    if: github.event_name == 'release'
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set XTF version
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' xtf_cli/version.py)
        if [ -z "$VERSION" ]; then
          echo "Unable to read VERSION from xtf_cli/version.py"
          exit 1
        fi
        echo "XTF version: $VERSION"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "*-XTF-*-${{ env.VERSION }}"
        merge-multiple: true
    
    - name: Prepare release assets
      run: |
        version="${{ env.VERSION }}"
        
        # Verify platform bundles exist for release
        for platform in linux-x64 linux-arm64 windows-x64 macos-arm64; do
          if [[ -f "ALL-XTF-${platform}-${version}.zip" ]]; then
            echo "Found platform bundle: ALL-XTF-${platform}-${version}.zip"
          else
            echo "Warning: Missing platform bundle for ${platform}"
          fi
        done
      shell: bash
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ALL-XTF-linux-x64-${{ env.VERSION }}.zip
          ALL-XTF-linux-arm64-${{ env.VERSION }}.zip
          ALL-XTF-windows-x64-${{ env.VERSION }}.zip
          ALL-XTF-macos-arm64-${{ env.VERSION }}.zip
          FULL-XTF-${{ env.VERSION }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-1-9-rollback:
    name: Build XTF 1.9 Rollback Package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_1_9_rollback }}
    uses: ./.github/workflows/build-1.9-rollback.yml
    permissions:
      contents: read

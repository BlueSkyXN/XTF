# XTF 2.0 strict configuration. Legacy flat YAML is not accepted by `XTF`.
schema_version: 2

auth:
  app_id: cli_your_app_id
  app_secret: null

source:
  type: file
  file:
    path: data.xlsx
    sheet_name: null

target:
  type: bitable
  bitable:
    app_token: your_app_token
    table_id: your_table_id
    create_missing_fields: true
    api_backend: base_v3
    user_id_type: open_id

sync:
  mode: full
  index:
    column: ID
    datetime_granularity: exact
  verify_remote_writes: false
  selective:
    enabled: false
    columns: []
    auto_include_index: true
    optimize_ranges: true
    max_gap_for_merge: 2
    preserve_column_order: true

conversion:
  strategy: base
  intelligence:
    date_confidence: 0.85
    choice_confidence: 0.9
    boolean_confidence: 0.95

control:
  batch_size: 500
  rate_limit_delay: 0.01
  max_retries: 3
  advanced:
    enabled: false
    retry:
      strategy: exponential_backoff
      initial_delay: 0.5
      max_wait_time: null
      multiplier: 2.0
      increment: 0.5
    rate_limit:
      strategy: fixed_wait
      window_size: 1.0
      max_requests: 10

output:
  log_level: INFO
